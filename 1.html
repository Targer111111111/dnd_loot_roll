<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Генератор Лута</title>
    
    <!-- Подключаем Tailwind CSS для базовой стилизации -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Подключаем пиксельные шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        body {
            /* VT323 отлично подходит для основного текста, так как он хорошо читается */
            font-family: 'VT323', monospace;
            font-size: 1.25rem;
            background-color: #0f172a; 
            background-image: 
                radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
            color: #e2e8f0;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Press Start 2P используем для акцентов: заголовков и цифр */
        h1, .d20-number, .rarity-label, .btn-roll, #item-name {
            font-family: 'Press Start 2P', cursive;
            line-height: 1.5;
        }

        /* Окно циферблата — теперь скругленный квадрат */
        .dial-container {
            width: 200px;
            height: 200px;
            border-radius: 24px; /* Скругление углов (мягкий квадрат) */
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.8);
            border: 4px solid #475569;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.5);
            transition: all 0.5s ease-out;
            position: relative;
        }

        .dial-container::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 30px; /* Пунктирная рамка тоже скруглена (чуть больше, так как она шире) */
            border: 2px dashed rgba(255,255,255,0.1);
            animation: rotate-slow 20s linear infinite;
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .d20-number {
            font-size: 3.5rem; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: color 0.15s ease, text-shadow 0.3s ease;
        }

        /* Анимация тряски во время прокрутки */
        .rolling {
            animation: shake 0.15s ease-in-out infinite alternate;
        }

        @keyframes shake {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.05) rotate(2deg); }
        }

        /* Эффекты свечения для разных редкостей */
        .glow-terrible { border-color: #dc2626; box-shadow: 0 0 40px #dc262680, inset 0 0 20px #dc262640; }
        .text-terrible { color: #ef4444; text-shadow: 0 0 15px #ef4444; }

        .glow-junk { border-color: #64748b; box-shadow: 0 0 40px #64748b80, inset 0 0 20px #64748b40; }
        .text-junk { color: #94a3b8; text-shadow: 0 0 15px #94a3b8; }

        .glow-potentially-useful { border-color: #0ea5e9; box-shadow: 0 0 40px #0ea5e980, inset 0 0 20px #0ea5e940; }
        .text-potentially-useful { color: #38bdf8; text-shadow: 0 0 15px #38bdf8; }

        .glow-useful { border-color: #10b981; box-shadow: 0 0 40px #10b98180, inset 0 0 20px #10b98140; }
        .text-useful { color: #34d399; text-shadow: 0 0 15px #34d399; }

        .glow-good-catch { border-color: #8b5cf6; box-shadow: 0 0 40px #8b5cf680, inset 0 0 20px #8b5cf640; }
        .text-good-catch { color: #a78bfa; text-shadow: 0 0 15px #a78bfa; }

        .glow-great-luck { border-color: #f59e0b; box-shadow: 0 0 50px #f59e0b99, inset 0 0 30px #f59e0b50; }
        .text-great-luck { color: #fbbf24; text-shadow: 0 0 20px #fbbf24; }

        /* Блок результата */
        #result-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none; 
        }
        
        #result-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Кнопка */
        .btn-roll {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            color: #e2e8f0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .btn-roll:hover:not(:disabled) {
            border-color: #64748b;
            background: linear-gradient(135deg, #334155, #1e293b);
            box-shadow: 0 0 15px rgba(100, 116, 139, 0.5);
            transform: translateY(-2px);
        }
        .btn-roll:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-2xl w-full flex flex-col items-center gap-10">
        
        <!-- Заголовок -->
        <div class="text-center">
            <h1 class="text-2xl sm:text-3xl tracking-wider text-slate-200 drop-shadow-lg mb-4 mt-4">Вендинг Лута</h1>
            <p class="text-slate-400 text-xl">Что-же что-же в сундучке</p>
        </div>

        <!-- Центральный циферблат (скругленный квадрат) -->
        <div id="dial" class="dial-container mt-6">
            <span id="dice-number" class="d20-number text-slate-300">20</span>
        </div>

        <!-- Кнопка броска -->
        <button id="roll-btn" class="btn-roll px-8 py-4 rounded-none text-xs sm:text-sm uppercase tracking-widest mt-4">
            Дать монетку
        </button>

        <!-- Блок с результатами -->
        <div id="result-container" class="w-full max-w-md bg-slate-900/80 p-6 rounded-none border-2 border-slate-700 shadow-2xl backdrop-blur-sm text-center">
            <div id="item-rarity" class="rarity-label text-[10px] uppercase tracking-[0.2em] mb-4">Редкость</div>
            <h2 id="item-name" class="text-xl sm:text-2xl mb-4 text-slate-100 leading-tight">Название Предмета</h2>
            
            <div class="w-full h-px bg-gradient-to-r from-transparent via-slate-500 to-transparent mb-4"></div>
            
            <p id="item-desc" class="text-slate-300 text-2xl leading-relaxed">
                Здесь будет красивое описание предмета, которое рассказывает его историю или свойства.
            </p>
        </div>
        
    </div>

    <script>
        const SPIN_DURATION_MS = 1500; 

        const lootConfig = {
            terrible: {
                label: "Ужасное",
                glowClass: "glow-terrible",
                textClass: "text-terrible",
                items: [
                    { name: "Вопящий камень", desc: "Обычный булыжник, который громко кричит после того как его взяли в руки" },
                    { name: "Капкан", desc: "Он уже активирован, дай спас ловкости." },
                    { name: "Мимик", desc: "Ну а че ты хотел." },
                    { name: "Куча пыли", desc: "Кхе кхе" }
                ]
            },
            junk: {
                label: "Мусор",
                glowClass: "glow-junk",
                textClass: "text-junk",
                items: [
                    { name: "Ничего", desc: "Ничего - это все. Бля хуйню сморозил" },
                    { name: "Куча тряпок", desc: "Лучше не нюхать" },
                    { name: "Гнилое дерево", desc: "Влажные и склизкие..." },
                    { name: "Гнилое мясо", desc: "Тошнотворный запах, но все еще можно приготовить" },
                    { name: "Тут насрано", desc: "Ну можешь забрать если хочешь" }
                ]
            },
            potentially_useful: {
                label: "Возможно полезное",
                glowClass: "glow-potentially-useful",
                textClass: "text-potentially-useful",
                items: [
                    { name: "3 Соли", desc: "Жизнь не сахар" },
                    { name: "2 Хлама", desc: "Запах ржавчины" },
                    { name: "2 Сахара", desc: "Жизнь не соль" },
                    { name: "2 Доски", desc: "Сухие" },
                    { name: "3 Травы", desc: "Нет не курительная" },
                    { name: "Хлопушка", desc: "Врагам не понравиться" },
                    { name: "Сушенные резкие травы", desc: "Может поможет, а может..." },
                    { name: "2 Спрея от ожогов", desc: "Гренка" },
                    { name: "2 Антибиотика", desc: "Легче?" },
                    { name: "2 Бинта", desc: "Залататься и вперед" }
                ]
            },
            useful: {
                label: "Полезное",
                glowClass: "glow-useful",
                textClass: "text-useful",
                items: [
                    { name: "4 Хлама", desc: "Запах ржавчины" },
                    { name: "3 болт", desc: "Купи себе чет" },
                    { name: "3 Куска мяса", desc: "Откуда оно здесь?" },
                    { name: "Спрей от ожогов", desc: "Гренка" },
                    { name: "3 Нокерса", desc: "Тебе лучше не занть из чего он сделан" },
                    { name: "Пиво", desc: "Поставь пускай отдыхает" },
                    { name: "Батарейки 2шт", desc: "батарейка" },
                    { name: "Стимулятор", desc: "НЕ СПАТЬ" },
                    { name: "Синее специи", desc: "Кислые как ягоды" },
                    { name: "Салатовые специи", desc: "Кисло-сладкое" },
                    { name: "Шоколадная стружка", desc: "Нямка" },
                    { name: "Мятные травы", desc: "Иди подкати к той девушке" },
                    { name: "Энергетик 'лимонная кислота'", desc: "Кисленько и универсально!" }

                ]
            },
            good_catch: {
                label: "Хороший улов",
                glowClass: "glow-good-catch",
                textClass: "text-good-catch",
                items: [
                    { name: "Ладан", desc: "Немного спокойствия" },
                    { name: "Лесной отвар", desc: "Тебе это полезно" },
                    { name: "2 Вина", desc: "Воспомнинания у зимних праздниках..." },
                    { name: "Петарды", desc: "Страшна" },
                    { name: "Адреналин", desc: "Не боишся иголок?" },
                    { name: "5 болтов", desc: "Нормально нормально" },
                    { name: "Батарейка 3шт", desc: "батарейки" },
                    { name: "WD - 40", desc: "Только изоленты не хватает" },
                    { name: "Обычный капкан", desc: "В этот раз не активированный" },
                    { name: "Горный чай", desc: "Ммммм, греет душу" },
                    { name: "Шприц обезбола", desc: "Боишся зубных врачей? Я да" },
                    { name: "Мятный ментос", desc: "Мамикс обронил..." },
                    { name: "2 Бургера", desc: "Сочный" },
                    { name: "Кока-кола", desc: "Люто" }
                ]
            },
            great_luck: {
                label: "Большая удача",
                glowClass: "glow-great-luck",
                textClass: "text-great-luck",
                items: [
                    { name: "Аптечный набор", desc: "Почти панацея" },
                    { name: "Батарейка 4шт", desc: "батарейки" },
                    { name: "Аксессуар", desc: "Иди думай какой ему аксессуар давать" },
                    { name: "Коробка пицы", desc: "Для всей семьи" },
                    { name: "Ром", desc: "Ну и где твой корабль?" },
                    { name: "Бочонок виски", desc: "....Можно к вам?" },
                    { name: "Книга черты", desc: "Умни" },
                    { name: "Дефибриллятор", desc: "Stand alive, stand alive..." },
                    { name: "Канистра бензина", desc: "Ну там вроде 10 ед" },
                    { name: "4 монеты", desc: "Очень богатый" },
                    { name: "Оружие", desc: "Вот будет забавно если тебе в итоге деревянную палку дадут" }
                ]
            }
        };

        const dialElement = document.getElementById('dial');
        const numberElement = document.getElementById('dice-number');
        const rollBtn = document.getElementById('roll-btn');
        const resultContainer = document.getElementById('result-container');
        const itemNameEl = document.getElementById('item-name');
        const itemRarityEl = document.getElementById('item-rarity');
        const itemDescEl = document.getElementById('item-desc');

        let isRolling = false;
        let rollInterval;

        function getRarityCategoryByRoll(roll) {
            if (roll === 1) return 'terrible';
            if (roll >= 2 && roll <= 6) return 'junk';
            if (roll >= 7 && roll <= 12) return 'potentially_useful';
            if (roll >= 13 && roll <= 16) return 'useful';
            if (roll >= 17 && roll <= 19) return 'good_catch';
            if (roll === 20) return 'great_luck';
            return 'junk'; 
        }

        function getRandomItemFromCategory(categoryKey) {
            const category = lootConfig[categoryKey];
            const items = category.items;
            const randomIndex = Math.floor(Math.random() * items.length);
            return {
                itemData: items[randomIndex],
                config: category
            };
        }

        function clearGlows() {
            const allGlows = Object.values(lootConfig).map(c => c.glowClass);
            const allTextClasses = Object.values(lootConfig).map(c => c.textClass);
            
            dialElement.classList.remove(...allGlows);
            numberElement.classList.remove(...allTextClasses);
            itemRarityEl.classList.remove(...allTextClasses);
            itemNameEl.classList.remove(...allTextClasses);
            
            numberElement.classList.add('text-slate-300');
        }

        function rollDice() {
            if (isRolling) return;
            
            isRolling = true;
            rollBtn.disabled = true;
            rollBtn.innerText = "СУДЬБА РЕШАЕТ...";
            
            resultContainer.classList.remove('show');
            clearGlows();
            dialElement.classList.add('rolling');

            const finalRoll = Math.floor(Math.random() * 20) + 1;
            
            rollInterval = setInterval(() => {
                const randomVisualNum = Math.floor(Math.random() * 20) + 1;
                numberElement.innerText = randomVisualNum;
            }, 60);

            setTimeout(() => {
                clearInterval(rollInterval);
                dialElement.classList.remove('rolling');
                
                numberElement.innerText = finalRoll;
                numberElement.classList.remove('text-slate-300');

                const categoryKey = getRarityCategoryByRoll(finalRoll);
                const result = getRandomItemFromCategory(categoryKey);

                dialElement.classList.add(result.config.glowClass);
                numberElement.classList.add(result.config.textClass);
                
                itemRarityEl.innerText = result.config.label;
                itemRarityEl.className = `rarity-label text-[10px] uppercase tracking-[0.2em] mb-4 ${result.config.textClass}`;
                
                itemNameEl.innerText = result.itemData.name;
                itemNameEl.className = `text-xl sm:text-2xl mb-4 leading-tight ${result.config.textClass}`;
                
                itemDescEl.innerText = result.itemData.desc;

                resultContainer.classList.add('show');

                isRolling = false;
                rollBtn.disabled = false;
                rollBtn.innerText = "Дать монетку";
                
            }, SPIN_DURATION_MS); 
        }

        rollBtn.addEventListener('click', rollDice);

    </script>
</body>
</html>
